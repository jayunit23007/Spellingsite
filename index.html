<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6c4cff">

  <title>Word Wizard Spelling Challenge</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="app-shell">

    <header class="brand">
      <div class="logo" aria-hidden="true">✨</div>

      <div>
        <p class="eyebrow">SPELLING PRACTICE</p>
        <h1>Word Wizard</h1>
      </div>
    </header>

    <!-- Start screen -->
    <section
      id="start-screen"
      class="card screen active"
      aria-labelledby="welcome-title"
    >
      <div class="mascot" aria-hidden="true">🦉</div>

      <h2 id="welcome-title">
        Ready for a spelling adventure?
      </h2>

      <p>
        Listen to each word, type how you think it is spelt,
        and collect stars!
      </p>

      <form id="start-form" class="form-stack">

        <label for="child-name">
          What is your first name?
        </label>

        <input
          id="child-name"
          name="child-name"
          type="text"
          maxlength="24"
          autocomplete="given-name"
          placeholder="Type your name"
          required
        >

        <label for="word-count">
          How many words would you like?
        </label>

        <div class="number-picker">
          <button
            class="count-button"
            type="button"
            data-change="-1"
            aria-label="One fewer word"
          >
            −
          </button>

          <output
            id="word-count-output"
            for="word-count"
          >
            7
          </output>

          <button
            class="count-button"
            type="button"
            data-change="1"
            aria-label="One more word"
          >
            +
          </button>
        </div>

        <input
          id="word-count"
          type="range"
          min="5"
          max="10"
          value="7"
          aria-label="Number of words"
        >

        <p class="hint">
          Choose between 5 and 10 words.
        </p>

        <button class="primary-button" type="submit">
          Start challenge
          <span aria-hidden="true">🚀</span>
        </button>

      </form>
    </section>

    <!-- Quiz screen -->
    <section
      id="quiz-screen"
      class="card screen"
      aria-labelledby="quiz-greeting"
    >
      <div class="quiz-topline">

        <div>
          <p id="quiz-greeting" class="eyebrow"></p>
          <h2 id="question-heading">Listen carefully...</h2>
        </div>

        <div class="score-pill" aria-live="polite">
          ⭐ <span id="live-score">0</span>
        </div>

      </div>

      <div
        class="progress-wrap"
        aria-label="Quiz progress"
      >
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <p id="progress-text" class="progress-text"></p>

      <button
        id="speak-button"
        class="sound-button"
        type="button"
      >
        <span class="sound-icon" aria-hidden="true">🔊</span>
        <span>Hear the word</span>
      </button>

      <form id="answer-form" class="answer-area">

        <label for="answer-input">
          Type the spelling
        </label>

        <input
          id="answer-input"
          type="text"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Type the word here"
          required
        >

        <button
          id="check-button"
          class="primary-button"
          type="submit"
        >
          Check my answer
        </button>

      </form>

      <div
        id="feedback"
        class="feedback"
        aria-live="assertive"
      ></div>

      <button
        id="next-button"
        class="secondary-button hidden"
        type="button"
      >
        Next word →
      </button>
    </section>

    <!-- Results screen -->
    <section
      id="results-screen"
      class="card screen"
      aria-labelledby="results-title"
    >
      <div
        id="result-badge"
        class="result-badge"
        aria-hidden="true"
      >
        🏆
      </div>

      <p class="eyebrow">CHALLENGE COMPLETE</p>

      <h2 id="results-title">
        Brilliant work!
      </h2>

      <p
        id="result-message"
        class="result-message"
      ></p>

      <div class="score-board">

        <div>
          <strong id="final-score">0</strong>
          <span>correct</span>
        </div>

        <div>
          <strong id="final-total">0</strong>
          <span>words</span>
        </div>

        <div>
          <strong id="final-percent">0%</strong>
          <span>score</span>
        </div>

      </div>

      <div
        id="wrong-list-wrap"
        class="wrong-list-wrap hidden"
      >
        <h3>Words to practise</h3>

        <ul id="wrong-list"></ul>

        <button
          id="retry-button"
          class="primary-button"
          type="button"
        >
          Practise these words again 🔁
        </button>
      </div>

      <button
        id="new-test-button"
        class="secondary-button"
        type="button"
      >
        Start a new challenge
      </button>
    </section>

  </main>

  <div id="confetti" aria-hidden="true"></div>
</body>
</html>
